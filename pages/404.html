<!DOCTYPE html>
<html lang="ru"
      data-title-ru="404 — Страница не найдена"
      data-title-en="404 — Page not found">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Страница не найдена</title>

    <script>
        (function () {
            var saved = localStorage.getItem('theme');
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            var theme = saved || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">

    <script src="js/header.js"></script>
    <script src="js/footer.js"></script>
</head>
<body>

    <site-header simple></site-header>

    <main>
        <section class="card full-width error-card">
            <h2 class="error-code">404</h2>
            <p class="error-text"
               data-ru="Такой страницы нет."
               data-en="This page does not exist.">Такой страницы нет.</p>
            <p class="error-link">
                <a href="pages/home.html"
                   data-ru="Вернуться на главную"
                   data-en="Back to home">Вернуться на главную</a>
            </p>
        </section>
    </main>

    <site-footer></site-footer>

    <script src="js/script.js"></script>
</body>
</html>
