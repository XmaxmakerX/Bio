<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Страница не найдена</title>

    <script>
        (function () {
            var saved = localStorage.getItem('theme');
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            var theme = saved || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <nav>
            <div class="nav-actions nav-actions-solo">
                <button id="theme-toggle" class="theme-toggle" aria-label="Переключить тему">
                    <span class="icon icon-sun"></span>
                    <span class="icon icon-moon"></span>
                </button>
            </div>
        </nav>
    </header>

    <main>
        <section class="card full-width error-card">
            <h2 class="error-code">404</h2>
            <p class="error-text">Такой страницы нет.</p>
            <p class="error-link"><a href="index.html">Вернуться на главную</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> Все права защищены</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
