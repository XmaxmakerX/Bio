<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проекты</title>

    <!-- Анти-вспышка темы -->
    <script>
        (function () {
            var saved = localStorage.getItem('theme');
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            var theme = saved || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <nav>
            <div id="nav-panel" class="nav-panel">
                <ul class="nav-links">
                    <li>
                        <a href="index.html">
                            <span class="nav-icon icon-home"></span>Главная
                        </a>
                    </li>
                    <li>
                        <a class="active" aria-current="page">
                            <span class="nav-icon icon-folder"></span>Проекты
                        </a>
                    </li>
                    <li>
                        <a href="contacts.html">
                            <span class="nav-icon icon-mail"></span>Контакты
                        </a>
                    </li>
                </ul>
            </div>

            <div class="nav-actions">
                <button id="theme-toggle" class="theme-toggle" aria-label="Переключить тему">
                    <span class="icon icon-sun"></span>
                    <span class="icon icon-moon"></span>
                </button>

                <button id="menu-toggle" class="menu-toggle" aria-label="Открыть меню">
                    <span class="burger-line"></span>
                    <span class="burger-line"></span>
                </button>
            </div>
        </nav>

        <div id="overlay" class="overlay"></div>
    </header>

    <main>
        <div class="grid">
            <section class="card full-width">
                <h2>Проекты</h2>
                <p class="wip">WIP</p>
            </section>
        </div>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> Все права защищены</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
